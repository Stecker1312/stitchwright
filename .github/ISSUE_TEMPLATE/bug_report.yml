name: Bug report
description: Something does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Please do not attach personal data or
        confidential projects. If possible, include the chart file as JSON.
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "e.g. Firefox 140 on Linux, Chrome on Android"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: chart
    attributes:
      label: Chart file or screenshot (optional)
      description: Please do not include personal data or confidential content.
    validations:
      required: false
