name: Feature request
description: An idea for Stitchwright.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Stitchwright stays local, data-sparing and without a cloud. Suggestions
        that fit this are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem does the idea solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Does it fit the project?
      options:
        - Editor / diagram
        - Symbol set / legend
        - Export / print
        - Translation / interface
        - Agents / file format
        - I do not know
    validations:
      required: true
